name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
          echo "--- find ai-service ---"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -name "pyproject.toml" -o -name "Dockerfile" 2>/dev/null
      - name: Lint with ruff
        run: |
          cd "$GITHUB_WORKSPACE/ai-service"
          pip install ruff
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/ai-service"
          pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          cd "$GITHUB_WORKSPACE/ai-service"
          pytest tests/unit -v --cov=app --cov-report=xml --timeout=60
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: test
          JWT_SECRET_KEY: test-secret-key-for-ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ai-service
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la "$GITHUB_WORKSPACE"
      - name: Build Docker image
        run: |
          cd "$GITHUB_WORKSPACE/ai-service"
          docker build -t ai-service --target runtime .
