[project]
name = "ai-commerce-service"
version = "1.0.0"
description = "AI Commerce Platform - Multi-provider AI orchestration service"
requires-python = ">=3.12"
authors = [
    {name = "AI Commerce Team"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-core>=2.0.0",
    "openai>=1.50.0",
    "anthropic>=0.45.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.0.0",
    "tiktoken>=0.7.0",
    "redis>=5.0.0",
    "motor>=3.0.0",
    "beanie>=1.20.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.10.0",
    "langgraph>=1.2.0",
    "pyarrow>=17.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require MongoDB/Redis)",
    "e2e: End-to-end tests (full system)",
    "slow: Tests that take more than 5 seconds",
]
timeout = 60

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*", "*.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "D", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
