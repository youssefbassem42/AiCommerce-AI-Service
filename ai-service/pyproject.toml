"app/infrastructure/providers/*.py" = ["B008", "B904", "ARG002"]
"app/infrastructure/providers/factory.py" = ["B904", "ARG004"]
"app/infrastructure/providers/mock_provider.py" = ["ARG002"]
"app/infrastructure/qdrant/provider.py" = ["B008", "B904"]
