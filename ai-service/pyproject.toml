"app/application/knowledge/generation/service.py" = ["B904", "ARG002"]
"app/application/knowledge/chunking/dependencies.py" = ["B008"]
"app/application/knowledge/processing/dependencies.py" = ["B008"]
"app/application/knowledge/chunking/chunking_service.py" = ["B904", "ARG002", "E741"]
"app/application/knowledge/coordinator.py" = ["B904", "ARG002"]
"app/application/knowledge/retrieval/mmr.py" = ["ARG001"]
"app/application/rag/prompt.py" = ["E501", "ARG001"]
"app/application/rag/prompt_builder.py" = ["B904", "ARG002"]
"app/application/rag/resolver.py" = ["B008", "B904"]
