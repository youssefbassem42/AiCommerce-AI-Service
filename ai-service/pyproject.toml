"app/api/knowledge/retrieval_dependencies.py" = ["B008", "ARG001"]
"app/api/knowledge/generation_dependencies.py" = ["B008"]
"app/api/knowledge/generation_router.py" = ["F821", "E501", "B008", "B904"]
"app/agents/*/prompts.py" = ["E501"]
"app/agents/*/agent.py" = ["ARG001", "ARG002"]
