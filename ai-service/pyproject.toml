[project]
name = "ai-commerce-service"
version = "1.0.0"
description = "AI Commerce Platform - Multi-provider AI orchestration service"
requires-python = ">=3.12"
authors = [
    {name = "AI Commerce Team"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-core>=2.0.0",
    "openai>=1.50.0",
    "anthropic>=0.45.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.0.0",
    "langdetect>=1.0.9",
    "tiktoken>=0.7.0",
    "redis>=5.0.0",
    "motor>=3.0.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.10.0",
    "langgraph>=1.2.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.0.0",
    "pyjwt>=2.0.0",
    "chardet>=5.0.0",
    "python-docx>=1.0.0",
    "pdfminer.six>=20221105",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require MongoDB/Redis)",
    "e2e: End-to-end tests (full system)",
    "slow: Tests that take more than 5 seconds",
]
timeout = 60

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*", "*.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002", "ARG004", "ARG005", "B008", "B904", "D", "E501", "S101", "E741"]
"scripts/*" = ["ARG001", "ARG002", "ARG004", "ARG005", "B008", "B904", "E501", "F403", "F811", "F821", "N806"]
"data/*" = ["ALL"]

# --- Pre-existing stub/placeholder code tolerances ---
"app/api/*/router.py" = ["B008", "B904", "F821", "ARG001"]
"app/api/admin/prompt_router.py" = ["B008", "B904"]
"app/api/admin/analytics_router.py" = ["B008", "B904"]
