[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
