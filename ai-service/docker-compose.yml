x-shared-env: &shared-env
  MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
  MONGO_DB: ${MONGO_DB:-ai_commerce}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-secure-random-secret}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}

services:
  ai-service:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment: *shared-env
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build: .
    command: celery -A app.workers worker --loglevel=info
    environment: *shared-env
    depends_on:
      ai-service:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A app.workers beat --loglevel=info
    environment: *shared-env
    depends_on:
      ai-service:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  qdrant_storage:
