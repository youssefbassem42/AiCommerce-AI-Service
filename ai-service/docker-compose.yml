x-shared-env: &shared-env
  MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
  MONGO_DB: ${MONGO_DB:-ai_commerce}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to the shared HS256 secret (>= 32 chars) matching the .NET backend}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}

services:
  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment: *shared-env
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    command: celery -A app.core.celery_app worker --concurrency=1 -Q default,ingestion,embedding,summarization,scheduler,cleanup -l INFO
    environment: *shared-env
    depends_on:
      ai-service:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=info
    environment: *shared-env
    depends_on:
      ai-service:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  qdrant_storage:
